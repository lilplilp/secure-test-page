<head>
<meta charset="UTF-8">

<title>加密頁面</title>

<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #0C0C0E;
  }
  #gate {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #17181C;
    border: 1px solid #26272E;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    padding: 32px;
    width: 100%;
    max-width: 420px;
    color: #eee;
    box-sizing: border-box;
  }
  h2 { margin-top: 0; font-size: 1.25rem; color: #fff; }
  p { color: #aaa; }
  input[type="password"] {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    font-size: 1rem;
    border: 1px solid #333;
    border-radius: 8px;
    margin: 12px 0;
    background: #0C0C0E;
    color: #fff;
  }
  button {
    width: 100%;
    padding: 10px 12px;
    font-size: 1rem;
    border: none;
    border-radius: 8px;
    background: #FF5537;
    color: #fff;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  #error { color: #ff6b6b; font-size: 0.9rem; min-height: 1.2em; margin-top: 4px; }
  #frame {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: 0;
  }
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <h2>&#128274; 需要密碼才能查看</h2>
    <p>請輸入密碼以檢視內容。</p>
    <input type="password" id="pw" placeholder="請輸入密碼" autofocus>
    <button onclick="tryDecrypt()">解鎖</button>
    <div id="error"></div>
  </div>
</div>

  function tryDecrypt() {
    var pw = document.getElementById('pw').value;
    var errorEl = document.getElementById('error');
    errorEl.textContent = '';
    try {
      var bytes = CryptoJS.AES.decrypt(CIPHERTEXT, pw);
      var plaintext = bytes.toString(CryptoJS.enc.Utf8);
      if (!plaintext) { throw new Error('empty'); }
      document.getElementById('gate').style.display = 'none';
      var frame = document.getElementById('frame');
      frame.srcdoc = plaintext;
      frame.style.display = 'block';
    } catch (e) {
      errorEl.textContent = '密碼錯誤，請再試一次。';
    }
  }

  document.getElementById('pw').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') tryDecrypt();
  });
</script>
